name: Build Godot Web Minimal (WeChat Compatible)

on:
  workflow_dispatch:

concurrency:
  group: build-minimal-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout Godot
      # ============================================================
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.1-stable
          submodules: recursive

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu-dev \
            libasound2-dev \
            libpulse-dev \
            libfreetype6-dev \
            libssl-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            yasm \
            python3-pip \
            ccache

      # ============================================================
      # 3. Configure ccache path
      # ============================================================
      - name: Configure ccache path
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/.ccache"

          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1

      # ============================================================
      # 4. Restore ccache
      # ============================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: godot-4.7.1-web-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('SConstruct', 'platform/web/detect.py', 'platform/web/SCsub') }}
          restore-keys: |
            godot-4.7.1-web-ccache-${{ runner.os }}-${{ runner.arch }}-

      # ============================================================
      # 5. Check ccache
      # ============================================================
      - name: Check ccache
        run: |
          echo "========================================"
          echo "CCACHE VERSION"
          echo "========================================"

          ccache --version

          echo ""
          echo "========================================"
          echo "CCACHE DIR"
          echo "========================================"

          echo "$CCACHE_DIR"

          echo ""
          echo "========================================"
          echo "CCACHE CONFIG"
          echo "========================================"

          ccache --show-config

          echo ""
          echo "========================================"
          echo "CCACHE STATS BEFORE BUILD"
          echo "========================================"

          ccache --show-stats

          echo ""
          echo "========================================"
          echo "CCACHE FILES BEFORE BUILD"
          echo "========================================"

          find "$CCACHE_DIR" -type f | wc -l || true

      # ============================================================
      # 6. Cache Emscripten
      # ============================================================
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            ~/.emscripten
            ~/.cache/emscripten
          key: emscripten-4.0.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            emscripten-4.0.0-${{ runner.os }}-

      # ============================================================
      # 7. Setup Emscripten
      # ============================================================
      - name: Setup Emscripten
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi

          cd emsdk

          ./emsdk install 4.0.0
          ./emsdk activate 4.0.0

          echo "EMSDK_ROOT=$PWD" >> "$GITHUB_ENV"

      # ============================================================
      # 8. Verify toolchain
      # ============================================================
      - name: Verify toolchain
        run: |
          source "${EMSDK_ROOT}/emsdk_env.sh"

          echo "========================================"
          echo "EMCC"
          echo "========================================"

          which emcc
          emcc --version

          echo ""
          echo "========================================"
          echo "EM++"
          echo "========================================"

          which em++
          em++ --version

          echo ""
          echo "========================================"
          echo "CCACHE"
          echo "========================================"

          which ccache
          ccache --version

          echo ""
          echo "CCACHE_DIR=$CCACHE_DIR"

      # ============================================================
      # 9. Build Godot
      # ============================================================
      - name: Build engine (minimal 2D)
        env:
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 1
        run: |
          source "${EMSDK_ROOT}/emsdk_env.sh"

          echo "========================================"
          echo "BUILD GODOT 4.7.1 WEB"
          echo "========================================"

          scons \
            platform=web \
            target=template_release \
            arch=wasm32 \
            optimize=size \
            lto=full \
            threads=no \
            c_compiler_launcher=ccache \
            cpp_compiler_launcher=ccache \
            disable_3d=yes \
            module_bullet_physics_enabled=no \
            module_raycast_enabled=no \
            module_webp_enabled=no \
            module_theora_enabled=no \
            module_minimp3_enabled=no \
            module_csg_enabled=no \
            module_gridmap_enabled=no \
            module_multiplayer_enabled=no \
            module_webrtc_enabled=no \
            module_jsonrpc_enabled=no \
            module_openxr_enabled=no \
            module_webxr_enabled=no \
            module_squish_enabled=no \
            module_tga_enabled=no \
            module_hdr_enabled=no \
            module_mbedtls_enabled=yes \
            --jobs=$(nproc)

      # ============================================================
      # 10. Show ccache result
      # ============================================================
      - name: Show ccache result
        run: |
          echo ""
          echo "========================================"
          echo "CCACHE AFTER BUILD"
          echo "========================================"

          ccache --show-stats

          echo ""
          echo "========================================"
          echo "CCACHE DIRECTORY"
          echo "========================================"

          du -sh "$CCACHE_DIR" || true

          echo ""
          echo "========================================"
          echo "CCACHE FILE COUNT"
          echo "========================================"

          find "$CCACHE_DIR" -type f | wc -l || true

      # ============================================================
      # 11. Inspect WASM
      # ============================================================
      - name: Inspect WASM
        run: |
          echo "========================================"
          echo "BIN"
          echo "========================================"

          ls -lah bin/ || true

          echo ""
          echo "========================================"
          echo "WASM FILES"
          echo "========================================"

          find bin -type f -name "*.wasm" -exec ls -lh {} \;

          echo ""
          echo "========================================"
          echo "WASM SIZE"
          echo "========================================"

          find bin -type f -name "*.wasm" -exec du -h {} \;

      # ============================================================
      # 12. Upload WASM
      # ============================================================
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-minimal-wasm
          path: bin/**/*.wasm
          if-no-files-found: error

