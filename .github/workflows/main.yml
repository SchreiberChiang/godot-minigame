name: Build Godot Web Minimal (WeChat Compatible)

on:
  workflow_dispatch:

concurrency:
  group: build-minimal-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 克隆 godot-minigame (包含 skills/ 补丁脚本)
      # ============================================================
      - name: Checkout godot-minigame
        uses: actions/checkout@v4
        with:
          repository: godothub/godot-minigame
          path: godot-minigame

      # ============================================================
      # 2. 克隆 Godot 官方源码并切换到指定提交
      # ============================================================
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: a16e481cf424f8e39dc2cdea1a6bdc1e309acdc1
          path: godot
          submodules: recursive

      # ============================================================
      # 3. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu-dev \
            libasound2-dev \
            libpulse-dev \
            libfreetype6-dev \
            libssl-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            yasm \
            python3-pip \
            ccache \
            ripgrep

      # ============================================================
      # 4. 配置 ccache
      # ============================================================
      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: godot-4.6.2-web-ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('godot/SConstruct', 'godot/platform/web/detect.py', 'godot/platform/web/SCsub') }}
          restore-keys: |
            godot-4.6.2-web-ccache-${{ runner.os }}-${{ runner.arch }}-

      # ============================================================
      # 5. 缓存并安装 Emscripten 4.0.10
      # ============================================================
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            ~/.emscripten
            ~/.cache/emscripten
          key: emscripten-4.0.10-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            emscripten-4.0.10-${{ runner.os }}-

      - name: Setup Emscripten
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi
          cd emsdk
          ./emsdk install 4.0.10
          ./emsdk activate 4.0.10
          echo "EMSDK_ROOT=$PWD" >> "$GITHUB_ENV"

      # ============================================================
      # 6. 应用 godot-minigame 适配补丁
      # ============================================================
      - name: Apply godot-minigame patchset
        run: |
          cd godot
          python ../godot-minigame/skills/scripts/apply_godot_patchset.py .

      - name: Verify patch applied
        run: |
          cd godot
          rg -n "WXMEMFS|write_offset|getWindowInfo|showKeyboard|wx.exitMiniProgram|wasm_simd|wasm\.br" platform/web modules || true

      # ============================================================
      # 7. 编译 2D 裁剪模板
      # ============================================================
      - name: Build engine (minimal 2D)
        env:
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 1
        run: |
          source "${EMSDK_ROOT}/emsdk_env.sh"
          cd godot
          echo "========================================"
          echo "BUILD GODOT 4.6.2 WEB (WeChat Compatible)"
          echo "========================================"
          scons \
            platform=web \
            target=template_release \
            arch=wasm32 \
            optimize=size \
            lto=full \
            threads=no \
            wasm_simd=no \
            disable_3d=yes \
            c_compiler_launcher=ccache \
            cpp_compiler_launcher=ccache \
            --jobs=$(nproc)

      # ============================================================
      # 8. 压缩 WASM (生成 .br 文件)
      # ============================================================
      - name: Compress WASM
        run: |
          cd godot
          # 安装 brotli
          sudo apt-get install -y brotli
          # 查找并压缩 wasm 文件
          find bin -name "*.wasm" -type f | while read -r wasm; do
            brotli --best "$wasm"
          done

      # ============================================================
      # 9. 显示编译结果
      # ============================================================
      - name: Show build results
        run: |
          cd godot
          echo "========================================"
          echo "BIN CONTENTS"
          echo "========================================"
          ls -lah bin/ || true
          echo ""
          echo "========================================"
          echo "WASM FILES"
          echo "========================================"
          find bin -type f \( -name "*.wasm" -o -name "*.wasm.br" -o -name "*.js" \) -exec ls -lh {} \;

      - name: Show ccache stats
        run: |
          ccache --show-stats
          du -sh "$CCACHE_DIR" || true

      # ============================================================
      # 10. 上传产物 (WASM + JS)
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-minigame-web
          path: |
            godot/bin/**/*.wasm
            godot/bin/**/*.wasm.br
            godot/bin/**/*.js
          if-no-files-found: error
