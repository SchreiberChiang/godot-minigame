name: Build Godot Web Minimal (WeChat Compatible)

on:
  workflow_dispatch:

concurrency:
  group: build-minimal-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout Godot
      # ============================================================
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.1-stable
          submodules: recursive

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu-dev \
            libasound2-dev \
            libpulse-dev \
            libfreetype6-dev \
            libssl-dev \
            libudev-dev \
            libxi-dev \
            libxrandr-dev \
            yasm \
            python3-pip \
            ccache

      # ============================================================
      # 3. Cache Emscripten
      # ============================================================
      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            ~/.emscripten
            ~/.cache/emscripten
          key: emscripten-4.0.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            emscripten-4.0.0-${{ runner.os }}-

      # ============================================================
      # 4. Setup Emscripten
      # ============================================================
      - name: Setup Emscripten
        run: |
          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git
          fi

          cd emsdk

          ./emsdk install 4.0.0
          ./emsdk activate 4.0.0

          echo "EMSDK_ROOT=$PWD" >> "$GITHUB_ENV"

      # ============================================================
      # 5. Configure ccache
      # ============================================================
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: godot-4.7.1-web-minimal
          max-size: 5G

      # ============================================================
      # 6. Force ccache configuration
      # ============================================================
      - name: Configure ccache environment
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1

          mkdir -p "$GITHUB_WORKSPACE/.ccache"

          ccache --zero-stats

          echo ""
          echo "========================================"
          echo "CCACHE CONFIG"
          echo "========================================"

          ccache --show-config

          echo ""
          echo "========================================"
          echo "CCACHE BEFORE BUILD"
          echo "========================================"

          ccache --show-stats

      # ============================================================
      # 7. Build Godot
      # ============================================================
      - name: Build engine (minimal 2D)
        env:
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 1
        run: |
          source "${EMSDK_ROOT}/emsdk_env.sh"

          # --------------------------------------------------------
          # Put ccache wrappers before compiler
          # --------------------------------------------------------
          export PATH="/usr/lib/ccache:$PATH"

          echo "========================================"
          echo "COMPILERS"
          echo "========================================"

          which ccache || true
          which emcc
          which em++

          echo ""
          echo "ccache:"
          ccache --version

          echo ""
          echo "CCACHE_DIR:"
          echo "$CCACHE_DIR"

          echo ""
          echo "========================================"
          echo "BUILD GODOT"
          echo "========================================"

          scons \
            platform=web \
            target=template_release \
            optimize=size \
            lto=full \
            use_ccache=yes \
            disable_3d=yes \
            module_bullet_physics_enabled=no \
            module_raycast_enabled=no \
            module_webp_enabled=no \
            module_theora_enabled=no \
            module_minimp3_enabled=no \
            module_csg_enabled=no \
            module_gridmap_enabled=no \
            module_multiplayer_enabled=no \
            module_webrtc_enabled=no \
            module_jsonrpc_enabled=no \
            module_openxr_enabled=no \
            module_webxr_enabled=no \
            module_squish_enabled=no \
            module_tga_enabled=no \
            module_hdr_enabled=no \
            module_mbedtls_enabled=yes \
            emcc_flags="-s WASM_BIGINT=1 -s USE_PTHREADS=0" \
            --jobs=$(nproc)

      # ============================================================
      # 8. Show ccache result
      # ============================================================
      - name: Check ccache after build
        run: |
          echo "========================================"
          echo "CCACHE AFTER BUILD"
          echo "========================================"

          ccache --show-stats

          echo ""
          echo "========================================"
          echo "CCACHE CONFIG"
          echo "========================================"

          ccache --show-config

          echo ""
          echo "========================================"
          echo "CCACHE DIRECTORY"
          echo "========================================"

          du -sh "$CCACHE_DIR" || true

          echo ""
          echo "========================================"
          echo "CCACHE FILE COUNT"
          echo "========================================"

          find "$CCACHE_DIR" -type f | wc -l || true

      # ============================================================
      # 9. List output
      # ============================================================
      - name: List bin contents
        run: |
          echo "========================================"
          echo "BIN"
          echo "========================================"

          ls -lah bin/ || true

          echo ""
          echo "========================================"
          echo "WASM"
          echo "========================================"

          find bin -name "*.wasm" -type f -exec ls -lh {} \; || true

          echo ""
          echo "========================================"
          echo "ALL FILES"
          echo "========================================"

          find bin -type f -printf "%p\t%k KB\n" | sort || true

      # ============================================================
      # 10. WASM size
      # ============================================================
      - name: Show WASM size
        run: |
          echo "========================================"
          echo "WASM SIZE"
          echo "========================================"

          find bin -name "*.wasm" -type f -exec du -h {} \;

      # ============================================================
      # 11. Upload WASM
      # ============================================================
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-minimal-wasm
          path: bin/**/*.wasm
          if-no-files-found: error
