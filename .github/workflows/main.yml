name: Build Godot Web Minimal (with ccache & diagnostics)

on:
  workflow_dispatch:

concurrency:
  group: build-minimal-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.1-stable          # ⚠️ 请确认该版本标签存在，可替换为如 4.6.1-stable
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libfreetype6-dev \
            libssl-dev libudev-dev libxi-dev libxrandr-dev yasm python3-pip ccache

      - name: Setup Emscripten manually
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.0
          ./emsdk activate 4.0.0
          echo "EMSDK_ROOT=$(pwd)" >> $GITHUB_ENV

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: godot-web-minimal
          max-size: 2G

      - name: Build engine (minimal 2D)
        env:
          CCACHE_COMPRESS: true
          CCACHE_COMPRESSLEVEL: 1
        run: |
          source "${EMSDK_ROOT}/emsdk_env.sh"
          scons platform=web target=template_release optimize=size lto=full \
            use_ccache=yes \
            module_bullet_enabled=no \
            module_raycast_enabled=no \
            module_webxr_enabled=no \
            module_multiplayer_enabled=no \
            module_webrtc_enabled=no \
            module_theora_enabled=no \
            module_minimp3_enabled=no \
            module_squish_enabled=no \
            module_gridmap_enabled=no \
            module_openxr_enabled=no \
            module_jsonrpc_enabled=no \
            module_mobile_vr_enabled=no \
            module_tga_enabled=no \
            module_hdr_enabled=no \
            module_meshoptimizer_enabled=no \
            module_lightmap_cpu_enabled=no \
            module_webp_enabled=no \
            --jobs=$(nproc)

      - name: List bin contents (diagnostic)
        run: |
          echo "=== Top-level bin/ ==="
          ls -la bin/ || true
          echo "=== Searching for .wasm files ==="
          find bin -name "*.wasm" -type f || echo "No .wasm files found."

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-wasm
          path: bin/**/*.wasm         # 上传所有生成的 .wasm 文件，无论名称和子目录
